function splatPts(size,seed){
  return Array.from({length:18},(_,i)=>{const a=(i/18)*Math.PI*2;const r=i%2===0?(size/2)*(0.65+Math.sin(i*2.3+seed)*0.3):(size/2)*(0.95+Math.cos(i*1.7+seed)*0.38);return `${size/2+r*Math.cos(a)},${size/2+r*Math.sin(a)}`;}).join(" ");
}
function Splat({style,size,color,opacity,seed}){return <svg width={size} height={size} style={{position:"absolute",opacity,pointerEvents:"none",...style}} viewBox={`0 0 ${size} ${size}`}><polygon points={splatPts(size,seed)} fill={color}/></svg>;}

      .sd{font-family:'Fredoka One',cursive;font-size:.95rem;color:rgba(255,255,255,.85)}
      .vd{font-family:'Fredoka One',cursive;font-size:1.4rem;margin-bottom:10px;text-shadow:2px 2px 0 #1a1a1a}
      .rt{background:#f3e8ff;border:3px solid #1a1a1a;border-radius:50px;height:22px;overflow:hidden;margin:16px 0 6px}
      .rf{height:100%;background:linear-gradient(90deg,#7B1FA2,#FF3EA5);border-radius:50px;transition:width 1s ease .5s}
      .ff{background:linear-gradient(135deg,#FF3EA5,#FF6BC0);border:3px solid #1a1a1a;border-radius:13px;padding:12px 18px;margin-bottom:18px;box-shadow:3px 3px 0 #1a1a1a;font-family:'Fredoka One',cursive;color:white;font-size:.9rem}
      .koo{display:inline-block;animation:wiggle 2s ease-in-out infinite;font-size:2.6rem;margin-bottom:14px}
      @keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
      @keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
      @keyframes fadeOut{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
      @keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
      @keyframes slimeDrop{0%{height:14px}100%{height:30px}}
      @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
      @keyframes stripe{0%{background-position:0% 0%}100%{background-position:200% 0%}}
      @keyframes glow{from{box-shadow:0 0 20px rgba(155,48,255,0.6),6px 6px 0 #1a1a1a}to{box-shadow:0 0 50px rgba(255,62,165,0.8),6px 6px 0 #1a1a1a}}
      @keyframes spinPulse{0%{transform:rotate(0deg) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
      @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
      @keyframes slideInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.25)}}
    `}</style>
    <CurtainBackdrop/>
    <Splat style={{top:"-45px",left:"-45px",zIndex:1}} size={190} color="#9B30FF" opacity={0.35} seed={1}/>
    <Splat style={{bottom:"-55px",right:"-55px",zIndex:1}} size={210} color="#FF3EA5" opacity={0.35} seed={2}/>
    <Splat style={{top:"18%",right:"-55px",zIndex:1}} size={130} color="#FFE033" opacity={0.25} seed={3}/>
    <ThemePlayer playing={themePlaying}/>
    {screen==="splash"&&<div className="sw"><div className={`cL${curtainOpen?" open":""}`}/><div className={`cR${curtainOpen?" open":""}`}/><div className="sc"><div style={{fontSize:"2.8rem",filter:"drop-shadow(0 0 14px rgba(255,224,51,0.9))",animation:"spinPulse 2s ease-in-out infinite"}}>✨</div><div className="st">THE ROSIE<br/>O'DONNELL SHOW</div><div className="ss">✦ TRIVIA EXTRAVAGANZA ✦</div><button className="eb" onClick={handleEnter}>🎵&nbsp;&nbsp;Hit it, John!</button><div className="eh">cue the band &amp; start the show</div></div></div>}
    <div className="rw">
      {screen==="title"&&<div className="tc"><div className="ts"/><SlimeDrops/><Splat style={{position:"absolute",top:14,right:14,zIndex:0}} size={75} color="#FF3EA5" opacity={0.8} seed={5}/><div className="koo">🟣</div><div className="tm">THE ROSIE SHOW</div><div className="tu">✨ TRIVIA EXTRAVAGANZA ✨</div><p className="td">Think you know your Koosh balls from your Broadway belters?<br/>Test your knowledge of the Queen of Nice — 1996 to 2002!</p><div className="pb">🎭 20 iconic questions • 12 per game • Pink slime for wrong answers!</div><div className="yn"><span style={{fontSize:"1.2rem"}}>▶</span><span>7 questions unlock real YouTube clips — watch after you answer!</span></div><button className="btn" onClick={startGame}>LET'S PLAY! 💜</button><div style={{marginTop:18,color:"#bbb",fontSize:".78rem",fontWeight:800}}>No Koosh balls were harmed in the making of this game.</div></div>}
      {screen==="game"&&current&&<div className="card"><div className="ch"><SlimeDrops/><div className="lo">💜 The Rosie Show</div><div className="ls">TRIVIA EXTRAVAGANZA</div><div className="sp">⭐ {score}/{totalQ}</div></div><div className="cb" style={{position:"relative"}}><StarBurst visible={burst.visible} correct={burst.correct}/><div style={{fontFamily:"'Fredoka One',cursive",fontSize:".88rem",color:"#888",marginBottom:5}}>Question {qIndex+1} of {totalQ}</div><div className="pt"><div className="pf" style={{width:`${((qIndex+1)/totalQ)*100}%`}}/></div><div className="qn" key={`n${qIndex}`}>Q{qIndex+1} — Can you handle this?</div><div className="qt" key={`q${qIndex}`}>{current.q}</div><div className="chs" key={`c${qIndex}`}>{current.choices.map((c,i)=>{let cls="cho";if(selected!==null){if(i===current.answer)cls+=" cor";else if(i===selected)cls+=" wro";else cls+=" dim";}return <button key={i} className={cls} onClick={()=>handleAnswer(i)} disabled={selected!==null}><span className="cl">{["A","B","C","D"][i]}</span><span>{c}</span></button>;})}</div>{showFact&&<div key={`f${qIndex}`}><div className="fb"><div className="fl">🎭 ROSIE SAYS —</div>{current.fact}</div><YTLink videoId={current.youtubeId} label={current.clipLabel}/></div>}{selected!==null&&<button className="bn" onClick={handleNext}>{qIndex+1>=totalQ?"See My Score! 🎉":"Next Question →"}</button>}</div></div>}
      {screen==="result"&&<div className="card"><div className="ch"><SlimeDrops/><div className="lo">💜 Game Over, Honey!</div><div className="ls">HERE'S YOUR FINAL SCORE</div></div><div className="rw2"><div className="scc"><div className="sb">{score}</div><div className="sd">out of {totalQ}</div></div><div className="vd" style={{color:verdict().c}}>{verdict().t}</div><div className="rt"><div className="rf" style={{width:`${pct}%`}}/></div><div style={{textAlign:"right",fontSize:".82rem",fontWeight:800,color:"#888",marginBottom:18}}>{pct}% correct</div><div className="ff">🎭 Fun fact: Rosie eventually added automated ceiling Koosh launchers AND a handheld Koosh cannon — across all 1,991 episodes!</div><div style={{marginBottom:20,fontSize:".88rem",fontWeight:800,color:"#555"}}>Watch more → <a href="https://www.youtube.com/@Rosie" target="_blank" rel="noopener noreferrer" style={{color:"#CC0000",textDecoration:"none"}}>youtube.com/@Rosie</a></div><button className="btn" onClick={startGame}>PLAY AGAIN! 💜</button></div></div>}
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
